<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2E7D32">
  <base href="$FLUTTER_BASE_HREF">
  <title>Shop Stock & Sales (Preview)</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { height: 100%; margin: 0; padding: 0; background: #10241a; overscroll-behavior: none; }
  </style>
</head>
<body>
  <div id="preload-status" style="
      position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; font-family: sans-serif; color: #ffffff;
      background: #10241a; padding: 24px; box-sizing: border-box;
      text-align: center; white-space: pre-wrap; word-break: break-word;
      font-size: 14px; line-height: 1.5;">
    Loading Shop Stock &amp; Sales…
  </div>

  <script>
    (function () {
      var shown = false;
      function showError(title, detail) {
        if (shown) return;
        shown = true;
        var el = document.getElementById('preload-status');
        if (!el) return;
        el.style.color = '#ffb4a9';
        el.textContent =
          'Preview failed to start.\n\n' + title +
          (detail ? '\n\n' + detail : '') +
          '\n\nThis is a browser-preview-only error — it does not affect the Android app.';
      }
      window.addEventListener('error', function (e) {
        showError(e.message || 'Script error', e.filename ? (e.filename + ':' + e.lineno) : '');
      });
      window.addEventListener('unhandledrejection', function (e) {
        var reason = e.reason;
        showError('Unhandled error', typeof reason === 'string' ? reason : (reason && reason.message) || String(reason));
      });
      setTimeout(function () {
        if (!shown && document.getElementById('preload-status')) {
          showError(
            'Still loading after 20 seconds.',
            'Possible causes: slow connection still fetching the Flutter engine, ' +
            'or the app started but Supabase configuration/connection failed silently. ' +
            'Try refreshing; if this persists, check that SUPABASE_URL and ' +
            'SUPABASE_ANON_KEY were set correctly when this build was made.'
          );
        }
      }, 20000);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
