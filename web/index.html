<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Shop Stock & Sales Management App — browser preview build. For real shop use, install the Android app; this web build exists for quick preview/testing only.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Shop Stock">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!--
    IMPORTANT for GitHub Pages project sites (e.g.
    https://<user>.github.io/<repo>/): this base href is replaced at
    build time via:
      flutter build web --base-href /<repo-name>/
    The literal $FLUTTER_BASE_HREF token below is substituted by the
    Flutter build tool — do not hardcode a path here.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2E7D32">

  <title>Shop Stock & Sales (Preview)</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <style>
    /* Prevents the page itself from scrolling/bouncing outside the
       Flutter canvas on mobile browsers, and gives a neutral
       letterbox background on wide (desktop) viewports so the app
       reads as a phone-shaped preview rather than stretching edge to
       edge — see lib/core/responsive/mobile_frame.dart for the
       matching in-app constraint. */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: #10241a;
      overscroll-behavior: none;
    }
  </style>
</head>
<body>
  <!--
    A visible loading message before the Flutter engine takes over —
    if this text is still showing after several seconds, something
    failed to load (see README.md "Browser preview troubleshooting").
  -->
  <div id="preload-status" style="
      position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; font-family: sans-serif; color: #ffffff;
      background: #10241a;">
    Loading Shop Stock &amp; Sales…
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
