<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B5E20"/>
      <stop offset="1" stop-color="#0E3D13"/>
    </linearGradient>
    <linearGradient id="boxFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8F0E8"/>
    </linearGradient>
    <linearGradient id="boxSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9D6C9"/>
      <stop offset="1" stop-color="#AFC0AF"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#66BB6A"/>
      <stop offset="1" stop-color="#A5D6A7"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bgGrad)"/>

  <!-- Right (side) face -->
  <path d="M620 430 L760 372 L760 640 L620 700 Z" fill="url(#boxSide)" stroke="#7A8C7A" stroke-width="6" stroke-linejoin="round"/>
  <!-- Top (inside) face -->
  <path d="M404 372 L620 430 L760 372 L544 314 Z" fill="#9FB2A0" stroke="#7A8C7A" stroke-width="6" stroke-linejoin="round"/>
  <!-- Front face -->
  <path d="M404 372 L620 430 L620 700 L404 640 Z" fill="url(#boxFace)" stroke="#5A6B5A" stroke-width="6" stroke-linejoin="round"/>

  <!-- Pharmacy cross on front face -->
  <g transform="translate(512 535)">
    <rect x="-26" y="-72" width="52" height="144" rx="12" fill="#2E7D32"/>
    <rect x="-72" y="-26" width="144" height="52" rx="12" fill="#2E7D32"/>
  </g>

  <!-- Sales/growth arrow rising from the box -->
  <path d="M512 232 L468 300 L500 300 L500 372 L524 372 L524 300 L556 300 Z"
        fill="url(#arrowGrad)" stroke="#388E3C" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="512" cy="232" r="10" fill="#C8E6C9"/>
</svg>
