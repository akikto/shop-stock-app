name: CI verify

# Runs analyze + test on pull requests before merge. Deploy workflow
# still runs on push to main only.

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee analyze-output.txt
          exit_code=${PIPESTATUS[0]}
          if [ "$exit_code" -ne 0 ]; then
            {
              echo "## Flutter analyze failed"
              echo '```'
              cat analyze-output.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$exit_code"
          fi

      - name: Upload analyze output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: analyze-output
          path: analyze-output.txt

      - name: flutter test
        run: flutter test
