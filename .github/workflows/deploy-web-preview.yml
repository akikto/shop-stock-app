name: Deploy web preview to GitHub Pages + build Android APK

# Builds a Flutter WEB PREVIEW and a debug-signed Android APK for
# internal testing/sideloading — this workflow never touches the
# Supabase schema/RLS policies. It runs entirely on GitHub's servers,
# so no local Flutter install is required to get either artifact.
#
# One-time setup required before this works (see README.md "GitHub
# Pages preview" section):
#   1. In this repo: Settings -> Pages -> Source -> "GitHub Actions".
#   2. In this repo: Settings -> Secrets and variables -> Actions ->
#      add repository secrets SUPABASE_URL and SUPABASE_ANON_KEY
#      (the public anon key only — NEVER the service_role key).
#      Optional for FCM-enabled APK builds:
#      GOOGLE_SERVICES_JSON — full google-services.json file contents
#      (Android client config only; NOT the Firebase service account).
#   3. If this repo is not named "shop-stock-app", update BASE_HREF
#      below to match, e.g. /<your-repo-name>/.
#
# NOTE on the APK: if android/ is not committed, `flutter create --platforms
# android .` generates the platform scaffold on each CI run.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  BASE_HREF: /shop-stock-app/

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable web (creates web/ platform config if missing)
        run: flutter config --enable-web

      # Public anon key + URL only — see AppConfig's own comment on why
      # these two values are safe to ship client-side, and why
      # service_role must never appear here.
      - name: Write build-time config from repository secrets
        run: |
          mkdir -p config
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_ANON_KEY repository secret."
            exit 1
          fi
          jq -n \
            --arg url "${{ secrets.SUPABASE_URL }}" \
            --arg key "${{ secrets.SUPABASE_ANON_KEY }}" \
            '{SUPABASE_URL: ($url | gsub("^\\s+|\\s+$"; "")), SUPABASE_ANON_KEY: ($key | gsub("^\\s+|\\s+$"; ""))}' \
            > config/config.ci.json
          jq -e '.SUPABASE_URL != "" and .SUPABASE_ANON_KEY != ""' config/config.ci.json >/dev/null
          echo "Supabase config file written (values not printed)."

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

      - name: flutter build web
        run: |
          flutter build web \
            --release \
            --pwa-strategy=none \
            --base-href "$BASE_HREF" \
            --dart-define-from-file=config/config.ci.json

      - name: Verify Supabase URL baked into web build
        run: |
          if ! grep -q "supabase.co" build/web/main.dart.js; then
            echo "Supabase URL was not embedded in the web build output."
            exit 1
          fi
          echo "Web build contains supabase.co host reference."

      - name: Remove secrets file before publishing web artifact
        run: rm -f config/config.ci.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - id: deployment
        uses: actions/deploy-pages@v4

      # APK is built after Pages deploy so a transient Maven/Gradle
      # outage (e.g. Maven Central HTTP 429) does not block the web
      # preview from updating.
      - name: Write build-time config for Android APK
        run: |
          mkdir -p config
          jq -n \
            --arg url "${{ secrets.SUPABASE_URL }}" \
            --arg key "${{ secrets.SUPABASE_ANON_KEY }}" \
            '{SUPABASE_URL: ($url | gsub("^\\s+|\\s+$"; "")), SUPABASE_ANON_KEY: ($key | gsub("^\\s+|\\s+$"; ""))}' \
            > config/config.ci.json
          jq -e '.SUPABASE_URL != "" and .SUPABASE_ANON_KEY != ""' config/config.ci.json >/dev/null

      - name: Generate android/ platform scaffold if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms android .
          fi

      - name: Write google-services.json for FCM (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "GOOGLE_SERVICES_JSON not set — APK builds without FCM client config."
            exit 0
          fi
          mkdir -p android/app
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          jq -e '.client[0].client_info.android_client_info.package_name' \
            android/app/google-services.json >/dev/null
          pkg="$(jq -r '.client[0].client_info.android_client_info.package_name' android/app/google-services.json)"
          if [ "$pkg" != "com.akikto.shop_stock_app" ]; then
            echo "google-services.json package must be com.akikto.shop_stock_app (got $pkg)"
            exit 1
          fi
          echo "google-services.json written for $pkg (content not logged)."

      - name: flutter build apk
        run: |
          set -e
          for attempt in 1 2 3 4; do
            if flutter build apk \
              --release \
              --dart-define-from-file=config/config.ci.json; then
              exit 0
            fi
            echo "APK build failed on attempt ${attempt}; retrying in $((attempt * 15))s..."
            sleep $((attempt * 15))
          done
          echo "APK build failed after 4 attempts."
          exit 1

      - name: flutter build appbundle
        run: |
          flutter build appbundle \
            --release \
            --dart-define-from-file=config/config.ci.json

      - name: Remove secrets file (never publish it)
        run: rm -f config/config.ci.json

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload Android AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Remove generated Android secrets
        if: always()
        run: rm -f android/app/google-services.json
