name: shop_stock_app
description: Shop Stock & Sales Management App (mobile-first, Flutter + Supabase)
publish_to: "none"
version: 0.4.0-phase4

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Backend / Auth
  supabase_flutter: ^2.5.0

  # State management
  flutter_riverpod: ^2.5.0

  # Routing (guarded/protected routes)
  go_router: ^14.0.0

  # Product photos (Phase 1)
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  cached_network_image: ^3.3.1
  uuid: ^4.4.0

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.3

flutter:
  uses-material-design: true

# -----------------------------------------------------------------------
# Dependencies intentionally NOT added yet (still deferred):
#   - drift / sqlite3_flutter_libs           -> offline sync phase
#   - firebase_messaging / firebase_core     -> notifications phase
# Added in Phase 1: image_picker, flutter_image_compress,
# cached_network_image, uuid — needed for product photo capture,
# compression, display, and client-generated storage paths.
# -----------------------------------------------------------------------
