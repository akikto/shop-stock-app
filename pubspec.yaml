name: shop_stock_app
description: Shop Stock & Sales Management App (mobile-first, Flutter + Supabase)
publish_to: "none"
version: 1.0.1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Backend / Auth
  supabase_flutter: ^2.5.0
  web: ^1.1.1

  # State management
  flutter_riverpod: ^2.5.0

  # Routing (guarded/protected routes)
  go_router: ^14.0.0

  # Product photos (Phase 1)
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  cached_network_image: ^3.3.1
  uuid: ^4.4.0

  # Phase 5 — offline sync (Android native)
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  connectivity_plus: ^6.0.5

  # Phase 3/6 — push notifications (Android; graceful no-op on web)
  firebase_core: ^3.4.0
  firebase_messaging: ^15.1.0

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.3
  drift_dev: ^2.20.0
  build_runner: ^2.4.12
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#0F73EB"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/icon/app_icon.png
    background_color: "#0F73EB"
    theme_color: "#0F73EB"
    favicon: true

flutter:
  uses-material-design: true

  assets:
    - assets/icon/app_icon.png
